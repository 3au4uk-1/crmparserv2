services:
  crmparser:
    image: ghcr.io/3au4uk-1/crmparserv2:latest
    container_name: crmparser
    ports:
      - "3000:3000"
    volumes:
      - crmparser-data:/app/data
    environment:
      - TZ=Europe/Moscow
      - CRM_TIMEZONE=Europe/Moscow
      - CRM_BASE_URL=${CRM_BASE_URL:-https://apihide.com/bitrix/calendar/}
      - CRM_LOGIN=${CRM_LOGIN}
      - CRM_PASSWORD=${CRM_PASSWORD}
      - TONY_BASE_URL=${TONY_BASE_URL:-https://crm.apihide.com}
      - TONY_LOGIN=${TONY_LOGIN}
      - TONY_PASSWORD=${TONY_PASSWORD}
      - TONY_REQUEST_DELAY_MS=${TONY_REQUEST_DELAY_MS:-350}
      - FETCH_CONCURRENCY=${FETCH_CONCURRENCY:-4}
      - PARSE_PIPELINE=${PARSE_PIPELINE:-parallel}
      - LLM_API_URL=${LLM_API_URL}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL}
      - TWENTY_API_URL=${TWENTY_API_URL}
      - TWENTY_API_TOKEN=${TWENTY_API_TOKEN}
      - TWENTY_API_TIMEOUT_MS=${TWENTY_API_TIMEOUT_MS:-60000}
      - TWENTY_API_RATE_LIMIT_MAX=${TWENTY_API_RATE_LIMIT_MAX:-95}
      - TWENTY_API_RATE_LIMIT_WINDOW_MS=${TWENTY_API_RATE_LIMIT_WINDOW_MS:-60000}
      - TWENTY_EVENTS_ENABLED=${TWENTY_EVENTS_ENABLED:-true}
      - TWENTY_WEBHOOK_SECRET=${TWENTY_WEBHOOK_SECRET}
      - PRINT_SHEET_ID=${PRINT_SHEET_ID}
      - GOOGLE_SERVICE_ACCOUNT_EMAIL=${GOOGLE_SERVICE_ACCOUNT_EMAIL}
      - GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY=${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY}
      - PRINT_SHEET_CACHE_TTL_MS=${PRINT_SHEET_CACHE_TTL_MS:-60000}
      - SESSION_SECRET=${SESSION_SECRET:-change-me-in-production}
      - APP_PASSWORD=${APP_PASSWORD}
      - IMPORT_API_SECRET=${IMPORT_API_SECRET}
      - TWENTY_APP_API_SECRET=${TWENTY_APP_API_SECRET}
      - TWENTY_APP_CORS_ORIGIN=${TWENTY_APP_CORS_ORIGIN}
      - DISABLE_AUTO_PARSE=${DISABLE_AUTO_PARSE:-false}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL}
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
      - TELEGRAM_USER_SESSION=${TELEGRAM_USER_SESSION}
      # Optional proxy for Telegram traffic (see xray sidecar); empty = direct.
      - TELEGRAM_PROXY_URL=${TELEGRAM_PROXY_URL}
      - TELEGRAM_HTTP_PROXY_URL=${TELEGRAM_HTTP_PROXY_URL}
      # Long polling instead of webhook when inbound from Telegram is blocked.
      - TELEGRAM_POLLING=${TELEGRAM_POLLING}
      - TELEGRAM_RECONCILE_INTERVAL_MS=${TELEGRAM_RECONCILE_INTERVAL_MS:-30000}
    networks:
      - twenty
    restart: unless-stopped

  # VLESS → SOCKS5/HTTP proxy for Telegram when direct access is blocked.
  # Start with: docker compose --profile proxy up -d
  # Requires ops/xray/config.json (see ops/xray/config.example.json).
  xray:
    image: teddysun/xray:latest
    container_name: crmparser-xray
    profiles: ["proxy"]
    volumes:
      - ./ops/xray/config.json:/etc/xray/config.json:ro
    networks:
      - twenty
    restart: unless-stopped

volumes:
  crmparser-data:

networks:
  twenty:
    external: true
    name: ${TWENTY_DOCKER_NETWORK:-twenty_default}
