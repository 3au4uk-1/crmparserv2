name: Staging data refresh

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Snapshot id (YYYYMMDDTHHMMSSZ). Empty = latest manifest in MinIO full-snapshots/
        required: false
        type: string
      dry_run:
        description: Print restore actions only (Dokploy schedule dry-run on docker host)
        required: false
        type: boolean
        default: false

concurrency:
  group: staging-refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ops/backup deps
        working-directory: ops/backup
        run: npm ci || npm install

      - name: Require Dokploy schedule configuration
        env:
          DOKPLOY_SCHEDULE_OPS_SYNC: ${{ vars.DOKPLOY_SCHEDULE_OPS_SYNC }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${DOKPLOY_SCHEDULE_OPS_SYNC:-}" ] && missing="${missing} DOKPLOY_SCHEDULE_OPS_SYNC"
          [ -z "${DOKPLOY_SCHEDULE_OPS_RUN:-}" ] && missing="${missing} DOKPLOY_SCHEDULE_OPS_RUN"
          if [ -n "${missing}" ]; then
            echo "::error::Missing required GitHub vars:${missing}"
            echo "Create disabled Dokploy schedules with ops/backup/ensure-schedules.mjs, then set DOKPLOY_SCHEDULE_OPS_SYNC and DOKPLOY_SCHEDULE_OPS_RUN in repository variables."
            exit 1
          fi

      - name: Sync ops tree to docker host
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_SYNC: ${{ vars.DOKPLOY_SCHEDULE_OPS_SYNC }}
        run: node remote-run.mjs sync

      - name: Resolve snapshot
        id: resolve
        working-directory: ops/backup
        env:
          SNAPSHOT_INPUT: ${{ github.event.inputs.snapshot_id }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
        run: |
          set -euo pipefail
          if [ -n "${SNAPSHOT_INPUT}" ]; then
            echo "Using snapshot_id from workflow input: ${SNAPSHOT_INPUT}"
            echo "id=${SNAPSHOT_INPUT}" >> "$GITHUB_OUTPUT"
          else
            MC_ALIAS="${MINIO_MC_ALIAS:-minio-home}"
            BUCKET="${MINIO_BUCKET:-dokploy}"
            LOGS=$(cat <<EOF | node remote-run.mjs run
          MC_ALIAS='${MC_ALIAS}'
          BUCKET='${BUCKET}'
          SNAPSHOT_ID=\$(mc ls "\${MC_ALIAS}/\${BUCKET}/full-snapshots/" 2>/dev/null \\
            | awk '{print \$NF}' | sed 's:/\$::' | grep -E '^[0-9]{8}T[0-9]{6}Z\$' | sort -r | head -n1)
          [ -n "\$SNAPSHOT_ID" ] || { echo "Could not resolve latest snapshot"; exit 1; }
          echo "SNAPSHOT_ID=\$SNAPSHOT_ID"
          EOF
            )
            echo "${LOGS}"
            SNAPSHOT_ID=$(echo "${LOGS}" | grep -E '^SNAPSHOT_ID=' | tail -n1 | cut -d= -f2-)
            [ -n "${SNAPSHOT_ID}" ] || { echo "::error::Could not parse SNAPSHOT_ID from remote logs"; exit 1; }
            echo "Resolved latest snapshot_id from MinIO: ${SNAPSHOT_ID}"
            echo "id=${SNAPSHOT_ID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore staging data on docker host
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          HOST_ROOT=/etc/dokploy/ops-backup
          SNAP='${{ steps.resolve.outputs.id }}'
          MC_ALIAS="${MINIO_MC_ALIAS:-minio-home}"
          BUCKET="${MINIO_BUCKET:-dokploy}"
          WORKDIR="${HOST_ROOT}/work/${SNAP}"
          DRY_FLAG=""
          if [ "${DRY_RUN}" = "true" ]; then
            DRY_FLAG="--dry-run"
          fi
          cat <<EOF | REMOTE_TIMEOUT_MS=2700000 node remote-run.mjs run
          set -euo pipefail
          MC_ALIAS='${MC_ALIAS}'
          BUCKET='${BUCKET}'
          SNAP='${SNAP}'
          HOST_ROOT='${HOST_ROOT}'
          WORKDIR='${WORKDIR}'
          mkdir -p "\$WORKDIR"
          mc cp "\${MC_ALIAS}/\${BUCKET}/full-snapshots/\${SNAP}/manifest.json" "\$WORKDIR/manifest.json"
          MINIO_MC_ALIAS="\$MC_ALIAS" MINIO_BUCKET="\$BUCKET" \\
            "\$HOST_ROOT/restore-host.sh" \\
              --target staging \\
              --snapshot-id "\$SNAP" \\
              --manifest "\$WORKDIR/manifest.json" \\
              --workdir "\$WORKDIR" \\
              ${DRY_FLAG}
          EOF

      - name: Verify DISABLE_AUTO_PARSE on staging crmparser
        if: github.event.inputs.dry_run != 'true'
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
        run: |
          set -euo pipefail
          LOGS=$(cat <<'EOF' | node remote-run.mjs run
          set -euo pipefail
          CID=$(docker ps -q --filter "label=com.docker.compose.project=crmparser-staging" --filter "label=com.docker.compose.service=crmparser" | head -n1)
          if [ -z "${CID}" ]; then
            CID=$(docker ps -q --filter "name=crmparser-staging" | head -n1)
          fi
          [ -n "${CID}" ] || { echo "MISSING_CONTAINER"; exit 1; }
          VALUE=$(docker inspect -f '{{range .Config.Env}}{{println .}}{{end}}' "${CID}" \
            | awk -F= '$1=="DISABLE_AUTO_PARSE"{print tolower($2); exit}')
          echo "DISABLE_AUTO_PARSE=${VALUE:-unset}"
          EOF
          )
          echo "${LOGS}"
          VALUE=$(echo "${LOGS}" | grep -E '^DISABLE_AUTO_PARSE=' | tail -n1 | cut -d= -f2-)
          echo "DISABLE_AUTO_PARSE=${VALUE}"
          case "${VALUE}" in
            true|1|yes)
              echo "OK: staging auto-parse remains disabled"
              ;;
            *)
              echo "::error::DISABLE_AUTO_PARSE is not true after refresh (got: ${VALUE:-unset})"
              exit 1
              ;;
          esac
