name: Release prepare (full prod snapshot)

on:
  workflow_dispatch:
    inputs:
      twenty_app_version:
        description: Twenty app version currently on prod (for rollback manifest)
        required: true
        type: string
      crmparser_image:
        description: Full image ref including digest if known
        required: true
        type: string
      twenty_app_git_sha:
        description: BrandingTwentyView git commit on prod (optional, for release rollback checkout)
        required: false
        type: string
  schedule:
    # Align with Dokploy volume/PG backup cron; manual dispatch ties versions for release gate.
    - cron: '0 2 * * *'

concurrency:
  group: release-prepare-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ops/backup deps
        working-directory: ops/backup
        run: npm ci || npm install

      - name: Capture full snapshot
        id: capture
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_TWENTY_PG_BACKUP_ID: ${{ vars.DOKPLOY_TWENTY_PG_BACKUP_ID }}
          DOKPLOY_TWENTY_FILES_VOLUME_BACKUP_ID: ${{ vars.DOKPLOY_TWENTY_FILES_VOLUME_BACKUP_ID }}
          DOKPLOY_CRMPARSER_VOLUME_BACKUP_ID: ${{ vars.DOKPLOY_CRMPARSER_VOLUME_BACKUP_ID }}
          DOKPLOY_DESTINATION_ID: ${{ vars.DOKPLOY_DESTINATION_ID }}
          TWENTY_APP_VERSION: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.twenty_app_version || 'nightly' }}
          TWENTY_APP_GIT_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.twenty_app_git_sha || '' }}
          CRMPARSER_IMAGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.crmparser_image || 'ghcr.io/3au4uk-1/crmparserv2:latest' }}
        run: node capture.mjs --out manifest.json

      - name: Read snapshot id
        id: snapshot
        working-directory: ops/backup
        run: |
          SNAPSHOT_ID=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('manifest.json','utf8')).snapshotId)")
          echo "id=${SNAPSHOT_ID}" >> "$GITHUB_OUTPUT"

      - name: Upload manifest artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-manifest-${{ steps.snapshot.outputs.id }}
          path: ops/backup/manifest.json
          retention-days: 14

      - name: Upload manifest to MinIO (optional)
        continue-on-error: true
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_SYNC: ${{ vars.DOKPLOY_SCHEDULE_OPS_SYNC }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_SCHEDULE_OPS_SYNC:-}" ] || [ -z "${DOKPLOY_SCHEDULE_OPS_RUN:-}" ]; then
            echo "DOKPLOY_SCHEDULE_OPS_SYNC or DOKPLOY_SCHEDULE_OPS_RUN not set — skipping MinIO manifest upload (artifact still available)"
            exit 0
          fi
          MC_ALIAS="${MINIO_MC_ALIAS:-minio-home}"
          BUCKET="${MINIO_BUCKET:-dokploy}"
          node remote-run.mjs sync
          python3 - <<'PY' > /tmp/upload-manifest.sh
          import os, pathlib
          b64 = __import__("base64").b64encode(pathlib.Path("manifest.json").read_bytes()).decode()
          snap_id = __import__("json").loads(pathlib.Path("manifest.json").read_text())["snapshotId"]
          print(f"""set -euo pipefail
          MC_ALIAS='{os.environ.get("MINIO_MC_ALIAS", "minio-home")}'
          BUCKET='{os.environ.get("MINIO_BUCKET", "dokploy")}'
          SNAP='{snap_id}'
          mkdir -p /tmp/manifest-upload
          echo '{b64}' | base64 -d > /tmp/manifest-upload/manifest.json
          mc cp /tmp/manifest-upload/manifest.json "$MC_ALIAS/$BUCKET/full-snapshots/$SNAP/manifest.json"
          rm -rf /tmp/manifest-upload
          """)
          PY
          REMOTE_TIMEOUT_MS=600000 node remote-run.mjs run --script-file /tmp/upload-manifest.sh
          echo "Uploaded manifest to ${MC_ALIAS}/${BUCKET}/full-snapshots/$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('manifest.json','utf8')).snapshotId)")/manifest.json"

      - name: Prune expired full-snapshots
        id: prune
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_DESTINATION_ID: ${{ vars.DOKPLOY_DESTINATION_ID }}
        run: node prune.mjs > expired.json

      - name: Upload expired prefixes artifact
        uses: actions/upload-artifact@v4
        with:
          name: expired-snapshot-prefixes-${{ steps.snapshot.outputs.id }}
          path: ops/backup/expired.json
          retention-days: 14

      - name: Delete expired snapshot objects (optional)
        continue-on-error: true
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_SYNC: ${{ vars.DOKPLOY_SCHEDULE_OPS_SYNC }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${DOKPLOY_SCHEDULE_OPS_SYNC:-}" ] || [ -z "${DOKPLOY_SCHEDULE_OPS_RUN:-}" ]; then
            echo "DOKPLOY_SCHEDULE_OPS_SYNC or DOKPLOY_SCHEDULE_OPS_RUN not set — expired prefixes recorded in expired.json artifact only"
            exit 0
          fi
          python3 - <<'PY' > /tmp/delete-expired.sh
          import os, pathlib
          b64 = __import__("base64").b64encode(pathlib.Path("expired.json").read_bytes()).decode()
          mc_alias = os.environ.get("MINIO_MC_ALIAS", "minio-home")
          bucket = os.environ.get("MINIO_BUCKET", "dokploy")
          body = """set -euo pipefail
          MC_ALIAS='__MC_ALIAS__'
          BUCKET='__BUCKET__'
          echo '__B64__' | base64 -d > /tmp/expired-snapshots.json
          PREFIXES=$(node -e "
            const fs = require('node:fs');
            const data = JSON.parse(fs.readFileSync('/tmp/expired-snapshots.json','utf8'));
            for (const p of data.expiredPrefixes || []) process.stdout.write(p + '\\n');
          ")
          if [ -z "${PREFIXES}" ]; then
            echo "No expired prefixes to delete"
            rm -f /tmp/expired-snapshots.json
            exit 0
          fi
          while IFS= read -r prefix; do
            [ -z "${prefix}" ] && continue
            echo "Deleting ${MC_ALIAS}/${BUCKET}/${prefix}"
            mc rm --recursive --force "${MC_ALIAS}/${BUCKET}/${prefix}"
          done <<< "${PREFIXES}"
          rm -f /tmp/expired-snapshots.json
          """
          print(
            body.replace("__MC_ALIAS__", mc_alias)
            .replace("__BUCKET__", bucket)
            .replace("__B64__", b64)
          )
          PY
          REMOTE_TIMEOUT_MS=600000 node remote-run.mjs run --script-file /tmp/delete-expired.sh
