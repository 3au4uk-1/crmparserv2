name: Rollback prod release (data + code)

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Snapshot id (YYYYMMDDTHHMMSSZ) from release-prepare manifest
        required: true
        type: string
      confirm:
        description: Type RESTORE_PROD to confirm prod release rollback
        required: true
        type: string

concurrency:
  group: rollback-prod-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation gate
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "RESTORE_PROD" ]; then
            echo "::error::Confirmation must be exactly RESTORE_PROD (got: ${{ github.event.inputs.confirm }})"
            exit 1
          fi
          echo "Confirmation OK — proceeding with prod release rollback"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ops/backup deps
        working-directory: ops/backup
        run: npm ci || npm install

      - name: Require Dokploy schedule configuration
        env:
          DOKPLOY_SCHEDULE_OPS_SYNC: ${{ vars.DOKPLOY_SCHEDULE_OPS_SYNC }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${DOKPLOY_SCHEDULE_OPS_SYNC:-}" ] && missing="${missing} DOKPLOY_SCHEDULE_OPS_SYNC"
          [ -z "${DOKPLOY_SCHEDULE_OPS_RUN:-}" ] && missing="${missing} DOKPLOY_SCHEDULE_OPS_RUN"
          if [ -n "${missing}" ]; then
            echo "::error::Missing required GitHub vars:${missing}"
            echo "Create disabled Dokploy schedules with ops/backup/ensure-schedules.mjs, then set DOKPLOY_SCHEDULE_OPS_SYNC and DOKPLOY_SCHEDULE_OPS_RUN in repository variables."
            exit 1
          fi

      - name: Sync ops tree to docker host
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_SYNC: ${{ vars.DOKPLOY_SCHEDULE_OPS_SYNC }}
        run: node remote-run.mjs sync

      - name: Restore prod data on docker host
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          SNAPSHOT_ID: ${{ github.event.inputs.snapshot_id }}
        run: |
          set -euo pipefail
          HOST_ROOT=/etc/dokploy/ops-backup
          SNAP='${SNAPSHOT_ID}'
          MC_ALIAS="${MINIO_MC_ALIAS:-minio-home}"
          BUCKET="${MINIO_BUCKET:-dokploy}"
          WORKDIR="${HOST_ROOT}/work/${SNAP}"
          cat <<EOF | REMOTE_TIMEOUT_MS=2700000 node remote-run.mjs run
          set -euo pipefail
          MC_ALIAS='${MC_ALIAS}'
          BUCKET='${BUCKET}'
          SNAP='${SNAP}'
          HOST_ROOT='${HOST_ROOT}'
          WORKDIR='${WORKDIR}'
          mkdir -p "\$WORKDIR"
          mc cp "\${MC_ALIAS}/\${BUCKET}/full-snapshots/\${SNAP}/manifest.json" "\$WORKDIR/manifest.json"
          cd "\$HOST_ROOT" && node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { assertManifest } from './lib/manifest.js';
            const m = JSON.parse(readFileSync(process.argv[1],'utf8'));
            assertManifest(m);
            if (m.snapshotId !== process.argv[2]) process.exit(3);
          " "\$WORKDIR/manifest.json" "\$SNAP"
          MINIO_MC_ALIAS="\$MC_ALIAS" MINIO_BUCKET="\$BUCKET" \\
            "\$HOST_ROOT/restore-host.sh" \\
              --target prod \\
              --snapshot-id "\$SNAP" \\
              --manifest "\$WORKDIR/manifest.json" \\
              --workdir "\$WORKDIR"
          EOF

      - name: Fetch manifest for release pin
        id: validate
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          SNAPSHOT_ID: ${{ github.event.inputs.snapshot_id }}
        run: |
          set -euo pipefail
          MC_ALIAS="${MINIO_MC_ALIAS:-minio-home}"
          BUCKET="${MINIO_BUCKET:-dokploy}"
          SNAP='${SNAPSHOT_ID}'
          LOGS=$(cat <<EOF | node remote-run.mjs run
          set -euo pipefail
          MC_ALIAS='${MC_ALIAS}'
          BUCKET='${BUCKET}'
          SNAP='${SNAP}'
          mc cat "\${MC_ALIAS}/\${BUCKET}/full-snapshots/\${SNAP}/manifest.json" | base64 -w0
          EOF
          )
          MANIFEST_B64=$(echo "${LOGS}" | tr -d '\r' | grep -E '^[A-Za-z0-9+/=]+$' | tail -n1)
          [ -n "${MANIFEST_B64}" ] || { echo "::error::Could not parse manifest base64 from remote logs"; exit 1; }
          echo "${MANIFEST_B64}" | base64 -d > manifest.json
          node --input-type=module -e "
          import { readFileSync, appendFileSync } from 'node:fs';
          import { assertManifest } from './lib/manifest.js';
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          assertManifest(manifest);
          if (manifest.snapshotId !== process.env.SNAPSHOT_ID) {
            throw new Error(\`manifest snapshotId \${manifest.snapshotId} does not match input \${process.env.SNAPSHOT_ID}\`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'twenty_version=' + manifest.versions.twentyAppVersion + '\n');
          appendFileSync(process.env.GITHUB_OUTPUT, 'twenty_ref=' + (manifest.versions.twentyAppGitSha || '') + '\n');
          "

      - name: Pin crmparser image and redeploy
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_CRMPARSER_COMPOSE_ID: ${{ vars.DOKPLOY_CRMPARSER_COMPOSE_ID }}
        run: node pin-crmparser-image.mjs manifest.json

      - name: Trigger Twenty app rollback in BrandingTwentyView
        env:
          DISPATCH_TOKEN: ${{ secrets.BRANDING_TWENTYVIEW_DISPATCH_TOKEN }}
          TWENTY_VERSION: ${{ steps.validate.outputs.twenty_version }}
          TWENTY_REF: ${{ steps.validate.outputs.twenty_ref }}
          SNAPSHOT_ID: ${{ github.event.inputs.snapshot_id }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::error::BRANDING_TWENTYVIEW_DISPATCH_TOKEN is required to dispatch Twenty app rollback."
            echo "Create a PAT with repo scope on 3au4uk-1/BrandingTwentyView and add as secret."
            exit 1
          fi

          PAYLOAD=$(node -e "
            const payload = {
              version: process.env.TWENTY_VERSION,
              snapshot_id: process.env.SNAPSHOT_ID,
            };
            const ref = (process.env.TWENTY_REF || '').trim();
            if (ref) payload.ref = ref;
            console.log(JSON.stringify(payload));
          ")

          HTTP=$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/3au4uk-1/BrandingTwentyView/dispatches" \
            -d "{\"event_type\":\"rollback-twenty-app\",\"client_payload\":${PAYLOAD}}")

          if [ "${HTTP}" != "204" ]; then
            echo "::error::repository_dispatch failed with HTTP ${HTTP}"
            cat /tmp/dispatch-response.json
            exit 1
          fi
          echo "Dispatched rollback-twenty-app to BrandingTwentyView (version=${TWENTY_VERSION}, ref=${TWENTY_REF:-none})"
