name: Rollback prod release (data + code)

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Snapshot id (YYYYMMDDTHHMMSSZ) from release-prepare manifest
        required: true
        type: string
      confirm:
        description: Type RESTORE_PROD to confirm prod release rollback
        required: true
        type: string

concurrency:
  group: rollback-prod-release
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation gate
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "RESTORE_PROD" ]; then
            echo "::error::Confirmation must be exactly RESTORE_PROD (got: ${{ github.event.inputs.confirm }})"
            exit 1
          fi
          echo "Confirmation OK — proceeding with prod release rollback"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ops/backup deps
        working-directory: ops/backup
        run: npm ci || npm install

      - name: Fetch manifest from MinIO
        id: resolve
        env:
          SNAPSHOT_ID: ${{ github.event.inputs.snapshot_id }}
          DOCKER_HOST_SSH_KEY: ${{ secrets.DOCKER_HOST_SSH_KEY }}
          DOCKER_HOST: ${{ vars.DOCKER_HOST }}
          DOCKER_HOST_USER: ${{ vars.DOCKER_HOST_USER }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
        run: |
          set -euo pipefail
          SNAPSHOT_ID="${SNAPSHOT_ID}"
          MANIFEST_LOCAL="ops/backup/manifest.json"

          if [ -z "${DOCKER_HOST_SSH_KEY:-}" ]; then
            echo "::error::DOCKER_HOST_SSH_KEY is required for prod release rollback."
            exit 1
          fi

          HOST="${DOCKER_HOST:-10.50.50.132}"
          USER="${DOCKER_HOST_USER:-root}"
          MC_ALIAS="${MINIO_MC_ALIAS:-minio-home}"
          BUCKET="${MINIO_BUCKET:-dokploy}"
          REMOTE_MANIFEST="/tmp/manifest-${SNAPSHOT_ID}.json"
          OBJECT="${MC_ALIAS}/${BUCKET}/full-snapshots/${SNAPSHOT_ID}/manifest.json"

          install -m 700 -d ~/.ssh
          echo "${DOCKER_HOST_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" \
            "mc cp '${OBJECT}' '${REMOTE_MANIFEST}'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${USER}@${HOST}:${REMOTE_MANIFEST}" "${MANIFEST_LOCAL}"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" \
            "rm -f '${REMOTE_MANIFEST}'"

          TWENTY_VERSION=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; console.log(JSON.parse(readFileSync('${MANIFEST_LOCAL}','utf8')).versions.twentyAppVersion)")
          TWENTY_REF=$(node --input-type=module -e "import { readFileSync } from 'node:fs'; const v=JSON.parse(readFileSync('${MANIFEST_LOCAL}','utf8')).versions; console.log(v.twentyAppGitSha||'')")
          echo "id=${SNAPSHOT_ID}" >> "$GITHUB_OUTPUT"
          echo "twenty_version=${TWENTY_VERSION}" >> "$GITHUB_OUTPUT"
          echo "twenty_ref=${TWENTY_REF}" >> "$GITHUB_OUTPUT"

      - name: Restore prod data on docker host
        env:
          DOCKER_HOST_SSH_KEY: ${{ secrets.DOCKER_HOST_SSH_KEY }}
          DOCKER_HOST: ${{ vars.DOCKER_HOST }}
          DOCKER_HOST_USER: ${{ vars.DOCKER_HOST_USER }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          SNAPSHOT_ID: ${{ steps.resolve.outputs.id }}
        run: |
          set -euo pipefail
          HOST="${DOCKER_HOST:-10.50.50.132}"
          USER="${DOCKER_HOST_USER:-root}"
          REMOTE_DIR="/tmp/prod-release-rollback-${SNAPSHOT_ID}"

          install -m 700 -d ~/.ssh
          echo "${DOCKER_HOST_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${HOST}" >> ~/.ssh/known_hosts 2>/dev/null || true

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" "mkdir -p '${REMOTE_DIR}'"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            ops/backup/restore-host.sh \
            ops/backup/manifest.json \
            "${USER}@${HOST}:${REMOTE_DIR}/"

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new "${USER}@${HOST}" bash -s <<REMOTE
          set -euo pipefail
          cd '${REMOTE_DIR}'
          chmod +x restore-host.sh
          MINIO_MC_ALIAS='${MINIO_MC_ALIAS:-minio-home}' MINIO_BUCKET='${MINIO_BUCKET:-dokploy}' \
            ./restore-host.sh \
              --target prod \
              --snapshot-id '${SNAPSHOT_ID}' \
              --manifest manifest.json
          REMOTE

      - name: Pin crmparser image and redeploy
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_CRMPARSER_COMPOSE_ID: ${{ vars.DOKPLOY_CRMPARSER_COMPOSE_ID }}
        run: node pin-crmparser-image.mjs manifest.json

      - name: Trigger Twenty app rollback in BrandingTwentyView
        env:
          DISPATCH_TOKEN: ${{ secrets.BRANDING_TWENTYVIEW_DISPATCH_TOKEN }}
          TWENTY_VERSION: ${{ steps.resolve.outputs.twenty_version }}
          TWENTY_REF: ${{ steps.resolve.outputs.twenty_ref }}
          SNAPSHOT_ID: ${{ steps.resolve.outputs.id }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::error::BRANDING_TWENTYVIEW_DISPATCH_TOKEN is required to dispatch Twenty app rollback."
            echo "Create a PAT with repo scope on 3au4uk-1/BrandingTwentyView and add as secret."
            exit 1
          fi

          PAYLOAD=$(node -e "
            const payload = {
              version: process.env.TWENTY_VERSION,
              snapshot_id: process.env.SNAPSHOT_ID,
            };
            const ref = (process.env.TWENTY_REF || '').trim();
            if (ref) payload.ref = ref;
            console.log(JSON.stringify(payload));
          ")

          HTTP=$(curl -sS -o /tmp/dispatch-response.json -w '%{http_code}' \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/3au4uk-1/BrandingTwentyView/dispatches" \
            -d "{\"event_type\":\"rollback-twenty-app\",\"client_payload\":${PAYLOAD}}")

          if [ "${HTTP}" != "204" ]; then
            echo "::error::repository_dispatch failed with HTTP ${HTTP}"
            cat /tmp/dispatch-response.json
            exit 1
          fi
          echo "Dispatched rollback-twenty-app to BrandingTwentyView (version=${TWENTY_VERSION}, ref=${TWENTY_REF:-none})"
