name: Rollback prod data

on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Snapshot id (YYYYMMDDTHHMMSSZ) from release-prepare manifest
        required: true
        type: string
      confirm:
        description: Type RESTORE_PROD to confirm prod data restore
        required: true
        type: string

concurrency:
  group: rollback-prod-data
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - name: Confirmation gate
        run: |
          set -euo pipefail
          if [ "${{ github.event.inputs.confirm }}" != "RESTORE_PROD" ]; then
            echo "::error::Confirmation must be exactly RESTORE_PROD (got: ${{ github.event.inputs.confirm }})"
            exit 1
          fi
          echo "Confirmation OK — proceeding with prod data restore"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install ops/backup deps
        working-directory: ops/backup
        run: npm ci || npm install

      - name: Require Dokploy schedule configuration
        env:
          DOKPLOY_SCHEDULE_OPS_SYNC: ${{ vars.DOKPLOY_SCHEDULE_OPS_SYNC }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${DOKPLOY_SCHEDULE_OPS_SYNC:-}" ] && missing="${missing} DOKPLOY_SCHEDULE_OPS_SYNC"
          [ -z "${DOKPLOY_SCHEDULE_OPS_RUN:-}" ] && missing="${missing} DOKPLOY_SCHEDULE_OPS_RUN"
          if [ -n "${missing}" ]; then
            echo "::error::Missing required GitHub vars:${missing}"
            echo "Create disabled Dokploy schedules with ops/backup/ensure-schedules.mjs, then set DOKPLOY_SCHEDULE_OPS_SYNC and DOKPLOY_SCHEDULE_OPS_RUN in repository variables."
            exit 1
          fi

      - name: Sync ops tree to docker host
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_SYNC: ${{ vars.DOKPLOY_SCHEDULE_OPS_SYNC }}
        run: node remote-run.mjs sync

      - name: Restore prod data on docker host
        working-directory: ops/backup
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_SCHEDULE_OPS_RUN: ${{ vars.DOKPLOY_SCHEDULE_OPS_RUN }}
          MINIO_MC_ALIAS: ${{ vars.MINIO_MC_ALIAS }}
          MINIO_BUCKET: ${{ vars.MINIO_BUCKET }}
          SNAPSHOT_ID: ${{ github.event.inputs.snapshot_id }}
        run: |
          set -euo pipefail
          HOST_ROOT=/etc/dokploy/ops-backup
          SNAP='${SNAPSHOT_ID}'
          MC_ALIAS="${MINIO_MC_ALIAS:-minio-home}"
          BUCKET="${MINIO_BUCKET:-dokploy}"
          WORKDIR="${HOST_ROOT}/work/${SNAP}"
          cat <<EOF | REMOTE_TIMEOUT_MS=2700000 node remote-run.mjs run
          set -euo pipefail
          MC_ALIAS='${MC_ALIAS}'
          BUCKET='${BUCKET}'
          SNAP='${SNAP}'
          HOST_ROOT='${HOST_ROOT}'
          WORKDIR='${WORKDIR}'
          mkdir -p "\$WORKDIR"
          mc cp "\${MC_ALIAS}/\${BUCKET}/full-snapshots/\${SNAP}/manifest.json" "\$WORKDIR/manifest.json"
          cd "\$HOST_ROOT" && node --input-type=module -e "
            import { readFileSync } from 'node:fs';
            import { assertManifest } from './lib/manifest.js';
            const m = JSON.parse(readFileSync(process.argv[1],'utf8'));
            assertManifest(m);
            if (m.snapshotId !== process.argv[2]) process.exit(3);
          " "\$WORKDIR/manifest.json" "\$SNAP"
          MINIO_MC_ALIAS="\$MC_ALIAS" MINIO_BUCKET="\$BUCKET" \\
            "\$HOST_ROOT/restore-host.sh" \\
              --target prod \\
              --snapshot-id "\$SNAP" \\
              --manifest "\$WORKDIR/manifest.json" \\
              --workdir "\$WORKDIR"
          EOF
